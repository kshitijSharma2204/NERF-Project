data:
  root: ./data/synthetic/lego
  height: 400
  width: 400
  focal: AUTO
  white_bkgd: true   # composite RGBA targets onto white (v1 used false: black background)

model:
  coarse:
    n_layers: 8
    hidden_dim: 256
    depth_samples: 64
  fine:
    n_layers: 8
    hidden_dim: 256
    depth_samples: 128

training:
  batch_rays: 1024
  lr: 5e-4
  lr_decay_steps: 500000   # lr = lr * lr_decay_rate ** (step / lr_decay_steps), nerf-pytorch default
  lr_decay_rate: 0.1
  max_steps: 300000
  precrop_iters: 500   # sample only the image centre for the first N steps (avoids collapse)
  precrop_frac: 0.5
  log_interval: 100
  val_interval: 5000
  val_indices: [0, 33, 66]   # fixed val views, rendered deterministically for val/psnr
  save_interval: 3000

render:
  render_only: false